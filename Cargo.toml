[package]
name = "evolution-rust"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nalgebra = { version = "0.35.0", features = ["serde", "serde-serialize"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
ciborium = "0.2.2"
ggez = "0.10.0"
glam = { version = "0.32.1", features = ["serde"] }
serde_json = "1.0.151"
